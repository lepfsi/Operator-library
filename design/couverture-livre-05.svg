<?xml version="1.0" encoding="UTF-8"?>
<!--
  Couverture — The Operator's Last Job (Livre 5)
  Design System : Technical Editorial / Dark Precision
  Format : 6" x 9" (152 x 229 mm). Grille en pixels (viewBox 0 0 640 960), ratio 6:9.
  Symbole : OPÉRATEUR RELAYÉ — silhouettes qui s'effacent progressivement.
  Accent livre 5 : Rouge brique #A83A3A.
  Date : 2026
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xml:lang="en"
     width="152mm" height="229mm"
     viewBox="0 0 640 960">

  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="light">
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite in="light" in2="SourceGraphic" operator="in" result="tex"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="tex"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="640" height="960" fill="#F7F5F0" filter="url(#paper)"/>

  <!-- ===== BANDEAU SUPÉRIEUR ===== -->
  <rect x="0" y="0" width="640" height="110" fill="#0A1A2F"/>
  <text x="70" y="70" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="300" font-size="30" letter-spacing="18" fill="#1CB5A0">DAILYOPS</text>
  <text x="570" y="70" text-anchor="end" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="300" font-size="24" letter-spacing="9" fill="#5A6B7A" opacity="0.75">THE OPERATOR'S LIBRARY — BOOK 05</text>

  <!-- ===== BLOC TITRE ===== -->
  <rect x="70" y="200" width="500" height="390" fill="#0A1A2F"/>
  <rect x="70" y="200" width="500" height="9" fill="#1CB5A0"/>

  <text x="120" y="330" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="800" font-size="48" letter-spacing="3" fill="#FFFFFF">THE OPERATOR'S</text>
  <text x="120" y="500" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="800" font-size="80" letter-spacing="3" fill="#FFFFFF">LAST JOB</text>

  <!-- ===== SOUS-TITRE ===== -->
  <text x="120" y="660" font-family="'Source Serif Pro', Georgia, serif"
        font-weight="400" font-style="italic" font-size="44" fill="#5A6B7A">Designing Systems</text>
  <text x="120" y="710" font-family="'Source Serif Pro', Georgia, serif"
        font-weight="400" font-style="italic" font-size="44" fill="#5A6B7A">That Outlive Their Creators</text>

  <!-- ===== SYMBOLE : OPÉRATEUR RELAYÉ (y ~760..870) =====
       Séquence de silhouettes : pleine → estompée → contour → absente. -->
  <g id="symbole-relais">
    <!-- Base horizontale acier -->
    <line x1="70" y1="870" x2="570" y2="870" stroke="#5A6B7A" stroke-width="4" opacity="0.5"/>

    <!-- Silhouette 1 : pleine rouge -->
    <g fill="#A83A3A">
      <circle cx="130" cy="795" r="22"/>
      <path d="M 100 850 Q 130 770 160 850 Z"/>
    </g>

    <!-- Silhouette 2 : mi-pleine -->
    <g fill="#A83A3A" opacity="0.55">
      <circle cx="260" cy="795" r="22"/>
      <path d="M 230 850 Q 260 770 290 850 Z"/>
    </g>

    <!-- Silhouette 3 : contour only -->
    <g fill="none" stroke="#5A6B7A" stroke-width="6">
      <circle cx="390" cy="795" r="22"/>
      <path d="M 360 850 Q 390 770 420 850 Z"/>
    </g>

    <!-- Silhouette 4 : contour très estompé -->
    <g fill="none" stroke="#5A6B7A" stroke-width="5" opacity="0.35">
      <circle cx="510" cy="795" r="22"/>
      <path d="M 480 850 Q 510 770 540 850 Z"/>
    </g>

    <!-- Seuil de relève : marqueur turquoise -->
    <line x1="450" y1="730" x2="450" y2="875" stroke="#1CB5A0" stroke-width="4"
          stroke-dasharray="10,10" opacity="0.7"/>

    <!-- Flèche de relais -->
    <polygon points="475,780 510,795 475,810 485,795" fill="#5A6B7A" opacity="0.6"/>
  </g>

  <!-- ===== AUTEUR ===== -->
  <text x="70" y="895" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="400" font-size="34" letter-spacing="13" fill="#0A1A2F">BA-NDOUWE STEVE</text>
  <text x="70" y="930" font-family="'Source Serif Pro', Georgia, serif"
        font-weight="300" font-style="italic" font-size="28" fill="#5A6B7A">Systems Engineer · Incident Analyst</text>

  <!-- ===== SIGNATURE DAILYOPS ===== -->
  <g transform="translate(515, 868)">
    <rect x="0" y="0" width="38" height="38" fill="#1CB5A0" rx="4"/>
    <text x="55" y="38" font-family="Sora, 'Space Grotesk', sans-serif"
          font-weight="300" font-size="22" letter-spacing="7" fill="#5A6B7A">DAILYOPS</text>
  </g>

</svg>
