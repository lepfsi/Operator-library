<?xml version="1.0" encoding="UTF-8"?>
<!--
  Beyond the Firewall — First cover
  The Operator's Library · Book 01
  Direction: Saffron / Ink / Bone — Operational Ideas
  6 × 9 in ratio — vector source, print-ready
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xml:lang="en"
     width="152.4mm" height="228.6mm"
     viewBox="0 0 1200 1800" role="img"
     aria-labelledby="cover-title cover-description">
  <title id="cover-title">Beyond the Firewall: The Reality of Modern IT Operations</title>
  <desc id="cover-description">A premium nonfiction cover on warm ivory paper with bold black typography and a saffron breach in an abstract vertical boundary.</desc>

  <defs>
    <pattern id="paper-grain" width="110" height="110" patternUnits="userSpaceOnUse">
      <path d="M0 22H110M0 88H110M28 0V110M82 0V110" fill="none" stroke="#948E84" stroke-width="0.55" opacity="0.13"/>
      <circle cx="14" cy="13" r="0.9" fill="#948E84" opacity="0.26"/>
      <circle cx="95" cy="73" r="0.8" fill="#948E84" opacity="0.18"/>
    </pattern>
    <filter id="saffron-soft" x="-80%" y="-30%" width="260%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Surface: confident warm paper, rather than a product interface. -->
  <rect width="1200" height="1800" fill="#F2EDE3"/>
  <rect width="1200" height="1800" fill="url(#paper-grain)"/>

  <!-- The boundary: a single dense, human-scale graphic metaphor. -->
  <path d="M818 -24 H1224 V1824 H795
           L809 1660 L788 1518 L810 1386 L784 1240 L806 1090
           L780 948 L805 808 L778 660 L800 510 L775 355 L797 214 Z"
        fill="#161616"/>
  <path d="M797 -24 L818 -24 L797 214 L775 355 L800 510 L778 660 L805 808
           L780 948 L806 1090 L784 1240 L810 1386 L788 1518 L809 1660 L795 1824
           L777 1824 L791 1660 L770 1518 L792 1386 L766 1240 L788 1090
           L762 948 L787 808 L760 660 L782 510 L757 355 L779 214 Z"
        fill="#F2A900"/>

  <!-- Fine editorial construction: visible closely, secondary at thumbnail scale. -->
  <g fill="none" stroke="#948E84" stroke-width="1.2" opacity="0.65">
    <circle cx="626" cy="886" r="284"/>
    <path d="M72 886H648"/>
    <path d="M626 490V1282"/>
  </g>
  <g aria-label="Breach marker">
    <circle cx="626" cy="886" r="23" fill="#F2EDE3" stroke="#161616" stroke-width="3"/>
    <circle cx="626" cy="886" r="8" fill="#1C6B5A"/>
    <path d="M72 886H583 M669 886H750" stroke="#161616" stroke-width="4"/>
    <path d="M777 850V922" stroke="#F2A900" stroke-width="9" filter="url(#saffron-soft)"/>
  </g>

  <!-- Collection and book register. -->
  <text x="72" y="91" fill="#161616" font-family="Arial, Helvetica, sans-serif"
        font-size="19" font-weight="700" letter-spacing="4.3">THE OPERATOR’S LIBRARY</text>
  <text x="1130" y="91" text-anchor="end" fill="#F2EDE3" font-family="Arial, Helvetica, sans-serif"
        font-size="17" font-weight="700" letter-spacing="3">BOOK 01</text>
  <line x1="72" y1="125" x2="748" y2="125" stroke="#161616" stroke-width="2"/>
  <line x1="818" y1="125" x2="1130" y2="125" stroke="#F2A900" stroke-width="3"/>

  <!-- Title: the primary object at both thumbnail and print scale. -->
  <g transform="translate(72,392)">
    <text x="0" y="0" fill="#1C6B5A" font-family="Arial, Helvetica, sans-serif"
          font-size="17" font-weight="700" letter-spacing="4.4">AN OPERATIONS ESSAY</text>
    <text x="0" y="188" fill="#161616" font-family="Arial, Helvetica, sans-serif"
          font-size="156" font-weight="700" letter-spacing="-6">BEYOND</text>
    <text x="5" y="282" fill="#F2A900" font-family="Arial, Helvetica, sans-serif"
          font-size="48" font-weight="700" letter-spacing="24">THE</text>
    <text x="0" y="438" fill="#161616" font-family="Arial, Helvetica, sans-serif"
          font-size="122" font-weight="700" letter-spacing="-5">FIREWALL</text>
  </g>

  <!-- Promise. -->
  <line x1="72" y1="1053" x2="458" y2="1053" stroke="#F2A900" stroke-width="9"/>
  <text x="72" y="1138" fill="#161616" font-family="Georgia, 'Times New Roman', serif"
        font-size="39" font-style="italic">The Reality of Modern</text>
  <text x="72" y="1188" fill="#161616" font-family="Georgia, 'Times New Roman', serif"
        font-size="39" font-style="italic">IT Operations</text>
  <text x="72" y="1264" fill="#948E84" font-family="Arial, Helvetica, sans-serif"
        font-size="16" font-weight="700" letter-spacing="3.2">SYSTEMS · INCIDENTS · DECISIONS</text>

  <!-- Author identity. -->
  <line x1="72" y1="1608" x2="748" y2="1608" stroke="#161616" stroke-width="1.4"/>
  <text x="72" y="1682" fill="#161616" font-family="Arial, Helvetica, sans-serif"
        font-size="29" font-weight="700" letter-spacing="5.9">STEVE BA-NDOUWE</text>
  <text x="72" y="1727" fill="#948E84" font-family="Georgia, 'Times New Roman', serif"
        font-size="26" font-style="italic">Cybersecurity Engineer</text>
  <text x="1130" y="1682" text-anchor="end" fill="#F2A900" font-family="Arial, Helvetica, sans-serif"
        font-size="16" font-weight="700" letter-spacing="3">OPERATIONAL IDEAS</text>
</svg>
