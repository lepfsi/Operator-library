<?xml version="1.0" encoding="UTF-8"?>
<!--
  Couverture — Beyond the Firewall (Livre 1)
  Design System : Technical Editorial / Dark Precision
  Format : 6" x 9" (152 x 229 mm). Grille en pixels (viewBox 0 0 640 960), ratio 6:9.
  Symbole : FRONTIÈRE TRAVERSÉE — ligne interrompue, point de rupture, flux de passage.
  Accent livre 1 : Bleu acier #2C5F8A.
  Date : 2026
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xml:lang="en"
     width="152mm" height="229mm"
     viewBox="0 0 640 960">

  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="light">
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite in="light" in2="SourceGraphic" operator="in" result="tex"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="tex"/></feMerge>
    </filter>
  </defs>

  <!-- Fond : Off-white texturé -->
  <rect x="0" y="0" width="640" height="960" fill="#F7F5F0" filter="url(#paper)"/>

  <!-- ===== BANDEAU SUPÉRIEUR ===== -->
  <rect x="0" y="0" width="640" height="110" fill="#0A1A2F"/>
  <text x="70" y="70" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="300" font-size="30" letter-spacing="18" fill="#1CB5A0">DAILYOPS</text>
  <text x="570" y="70" text-anchor="end" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="300" font-size="24" letter-spacing="9" fill="#5A6B7A" opacity="0.75">THE OPERATOR'S LIBRARY — BOOK 01</text>

  <!-- ===== BLOC TITRE (x=70..570, y=200..590) ===== -->
  <rect x="70" y="200" width="500" height="390" fill="#0A1A2F"/>
  <rect x="70" y="200" width="500" height="9" fill="#1CB5A0"/>

  <!-- BEYOND / THE / FIREWALL — tailles calibrées pour tenir dans 450px de large -->
  <text x="120" y="320" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="800" font-size="105" letter-spacing="5" fill="#FFFFFF">BEYOND</text>
  <text x="120" y="395" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="300" font-size="50" letter-spacing="30" fill="#1CB5A0">THE</text>
  <text x="120" y="560" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="700" font-size="90" letter-spacing="3" fill="#FFFFFF">FIREWALL</text>

  <!-- ===== SOUS-TITRE ===== -->
  <text x="120" y="660" font-family="'Source Serif Pro', Georgia, serif"
        font-weight="400" font-style="italic" font-size="44" fill="#5A6B7A">The Reality of Modern</text>
  <text x="120" y="710" font-family="'Source Serif Pro', Georgia, serif"
        font-weight="400" font-style="italic" font-size="44" fill="#5A6B7A">IT Operations</text>

  <!-- ===== SYMBOLE : FRONTIÈRE TRAVERSÉE (x 70..570, y ~790) =====
       Ligne acier interrompue au centre ; flux de points qui traverse la
       rupture ; losange turquoise = point de passage critique. -->
  <g id="symbole-frontiere">
    <!-- Ligne de frontière acier, interrompue au centre (gap ~85px) -->
    <line x1="70" y1="800" x2="270" y2="800"
          stroke="#5A6B7A" stroke-width="6" stroke-linecap="round"/>
    <line x1="370" y1="800" x2="570" y2="800"
          stroke="#5A6B7A" stroke-width="6" stroke-linecap="round"/>
    <!-- Marqueurs de bord -->
    <line x1="70" y1="778" x2="70" y2="822" stroke="#5A6B7A" stroke-width="6"/>
    <line x1="570" y1="778" x2="570" y2="822" stroke="#5A6B7A" stroke-width="6"/>

    <!-- Point de rupture : losange turquoise + halo -->
    <circle cx="320" cy="800" r="40" fill="none" stroke="#1CB5A0" stroke-width="2.5" opacity="0.35"/>
    <polygon points="320,778 342,800 320,822 298,800" fill="#1CB5A0"/>

    <!-- Flux traversant : points accent qui passent la frontière -->
    <g fill="#2C5F8A">
      <circle cx="160" cy="800" r="6" opacity="0.5"/>
      <circle cx="200" cy="800" r="6" opacity="0.7"/>
      <circle cx="240" cy="800" r="6" opacity="0.9"/>
      <circle cx="400" cy="800" r="6" opacity="0.9"/>
      <circle cx="440" cy="800" r="6" opacity="0.7"/>
      <circle cx="480" cy="800" r="6" opacity="0.5"/>
    </g>
    <!-- Flèches directionnelles subtiles -->
    <polygon points="285,786 305,800 285,814 293,800" fill="#5A6B7A" opacity="0.6"/>
    <polygon points="355,786 335,800 355,814 347,800" fill="#5A6B7A" opacity="0.6"/>
  </g>

  <!-- ===== AUTEUR ===== -->
  <text x="70" y="895" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="400" font-size="34" letter-spacing="13" fill="#0A1A2F">BA-NDOUWE STEVE</text>
  <text x="70" y="930" font-family="'Source Serif Pro', Georgia, serif"
        font-weight="300" font-style="italic" font-size="28" fill="#5A6B7A">Systems Engineer · Incident Analyst</text>

  <!-- ===== SIGNATURE DAILYOPS ===== -->
  <g transform="translate(515, 868)">
    <rect x="0" y="0" width="38" height="38" fill="#1CB5A0" rx="4"/>
    <text x="55" y="38" font-family="Sora, 'Space Grotesk', sans-serif"
          font-weight="300" font-size="22" letter-spacing="7" fill="#5A6B7A">DAILYOPS</text>
  </g>

</svg>
