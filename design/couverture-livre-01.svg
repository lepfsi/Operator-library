<?xml version="1.0" encoding="UTF-8"?>
<!--
  Couverture — Beyond the Firewall (Livre 1)
  Design System : Technical Editorial / Dark Precision
  Format : 6" x 9" (152 x 229 mm), fond pleine page.
  Symbole : FRONTIÈRE TRAVERSÉE — une ligne interrompue, point de rupture,
            flux qui passe d'un côté à l'autre de la limite.
  Accent livre 1 : Bleu acier #2C5F8A.
  Date : 2026
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xml:lang="en"
     width="152mm" height="229mm"
     viewBox="0 0 152 229">

  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="light">
        <feFuncA type="linear" slope="0.06"/>
      </feComponentTransfer>
      <feComposite in="light" in2="SourceGraphic" operator="in" result="tex"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="tex"/></feMerge>
    </filter>
  </defs>

  <!-- Fond : Off-white texturé -->
  <rect x="0" y="0" width="152" height="229" fill="#F7F5F0" filter="url(#paper)"/>

  <!-- ===== BANDEAU SUPÉRIEUR : marque éditoriale ===== -->
  <rect x="0" y="0" width="152" height="26" fill="#0A1A2F"/>
  <text x="16" y="17" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="300" font-size="7pt" letter-spacing="4" fill="#1CB5A0">DAILYOPS</text>
  <text x="136" y="17" text-anchor="end" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="300" font-size="6pt" letter-spacing="2" fill="#5A6B7A" opacity="0.75">THE OPERATOR'S LIBRARY — BOOK 01</text>

  <!-- ===== BLOC TITRE PRINCIPAL (Deep Navy, asymétrique gauche) ===== -->
  <rect x="16" y="50" width="120" height="92" fill="#0A1A2F"/>
  <rect x="16" y="50" width="120" height="2.2" fill="#1CB5A0"/>

  <!-- BEYOND / THE / FIREWALL -->
  <text x="28" y="84" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="800" font-size="30pt" letter-spacing="1.5" fill="#FFFFFF">BEYOND</text>
  <text x="28" y="104" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="300" font-size="13pt" letter-spacing="8" fill="#1CB5A0">THE</text>
  <text x="28" y="132" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="700" font-size="27pt" letter-spacing="1" fill="#FFFFFF">FIREWALL</text>

  <!-- ===== SOUS-TITRE ===== -->
  <text x="28" y="158" font-family="'Source Serif Pro', Georgia, serif"
        font-weight="400" font-style="italic" font-size="10.5pt" fill="#5A6B7A">The Reality of Modern</text>
  <text x="28" y="170" font-family="'Source Serif Pro', Georgia, serif"
        font-weight="400" font-style="italic" font-size="10.5pt" fill="#5A6B7A">IT Operations</text>

  <!-- ===== SYMBOLE : FRONTIÈRE TRAVERSÉE =====
       Ligne acier interrompue au centre ; flux de points qui traverse la
       rupture (de la gauche du pare-feu vers la droite, l'intérieur du système).
       Le losange turquoise = point de passage critique. -->
  <g id="symbole-frontiere">
    <!-- Ligne de frontière acier, interrompue au centre (gap 20mm) -->
    <line x1="16" y1="188" x2="64" y2="188"
          stroke="#5A6B7A" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="88" y1="188" x2="136" y2="188"
          stroke="#5A6B7A" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Marqueurs de bord (extrémités renforcées) -->
    <line x1="16" y1="183" x2="16" y2="193" stroke="#5A6B7A" stroke-width="1.4"/>
    <line x1="136" y1="183" x2="136" y2="193" stroke="#5A6B7A" stroke-width="1.4"/>

    <!-- Point de rupture : losange turquoise -->
    <g transform="translate(76, 188)">
      <circle r="9" fill="none" stroke="#1CB5A0" stroke-width="0.6" opacity="0.35"/>
      <polygon points="0,-5 5,0 0,5 -5,0" fill="#1CB5A0"/>
    </g>

    <!-- Flux traversant : points accent qui passent la frontière -->
    <g fill="#2C5F8A">
      <circle cx="40" cy="188" r="1.4" opacity="0.55"/>
      <circle cx="50" cy="188" r="1.4" opacity="0.7"/>
      <circle cx="60" cy="188" r="1.4" opacity="0.85"/>
      <!-- le passage traverse la rupture -->
      <circle cx="92" cy="188" r="1.4" opacity="0.85"/>
      <circle cx="102" cy="188" r="1.4" opacity="0.7"/>
      <circle cx="112" cy="188" r="1.4" opacity="0.55"/>
    </g>
    <!-- Flèches directionnelles subtiles -->
    <polygon points="68,184.5 73,188 68,191.5 70,188" fill="#5A6B7A" opacity="0.6"/>
    <polygon points="84,184.5 79,188 84,191.5 82,188" fill="#5A6B7A" opacity="0.6"/>
  </g>

  <!-- ===== BLOC AUTEUR (bas gauche) ===== -->
  <text x="16" y="212" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="400" font-size="8pt" letter-spacing="3" fill="#0A1A2F">BA-NDOUWE STEVE</text>
  <text x="16" y="221" font-family="'Source Serif Pro', Georgia, serif"
        font-weight="300" font-style="italic" font-size="7pt" fill="#5A6B7A">Systems Engineer · Incident Analyst</text>

  <!-- ===== SIGNATURE DAILYOPS (bas droite) ===== -->
  <g transform="translate(122, 205)">
    <rect x="0" y="0" width="9" height="9" fill="#1CB5A0" rx="1"/>
    <text x="13" y="9" font-family="Sora, 'Space Grotesk', sans-serif"
          font-weight="300" font-size="5.5pt" letter-spacing="1.5" fill="#5A6B7A">DAILYOPS</text>
  </g>

</svg>
