<?xml version="1.0" encoding="UTF-8"?>
<!--
  Couverture — The Age of Operational AI (Livre 4)
  Design System : Technical Editorial / Dark Precision
  Format : 6" x 9" (152 x 229 mm). Grille en pixels (viewBox 0 0 640 960), ratio 6:9.
  Symbole : TRANSITION HUMAIN → SYSTÈME → AGENT — 3 cercles reliés, humain diminue.
  Accent livre 4 : Vert émeraude #1F7A5A.
  Date : 2026
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xml:lang="en"
     width="152mm" height="229mm"
     viewBox="0 0 640 960">

  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="light">
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite in="light" in2="SourceGraphic" operator="in" result="tex"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="tex"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="640" height="960" fill="#F7F5F0" filter="url(#paper)"/>

  <!-- ===== BANDEAU SUPÉRIEUR ===== -->
  <rect x="0" y="0" width="640" height="110" fill="#0A1A2F"/>
  <text x="70" y="70" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="300" font-size="30" letter-spacing="18" fill="#1CB5A0">DAILYOPS</text>
  <text x="570" y="70" text-anchor="end" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="300" font-size="24" letter-spacing="9" fill="#5A6B7A" opacity="0.75">THE OPERATOR'S LIBRARY — BOOK 04</text>

  <!-- ===== BLOC TITRE ===== -->
  <rect x="70" y="200" width="500" height="390" fill="#0A1A2F"/>
  <rect x="70" y="200" width="500" height="9" fill="#1CB5A0"/>

  <text x="120" y="330" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="800" font-size="118" letter-spacing="6" fill="#FFFFFF">THE AGE</text>
  <text x="120" y="420" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="300" font-size="38" letter-spacing="4" fill="#1F7A5A">OF OPERATIONAL</text>
  <text x="120" y="560" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="800" font-size="128" letter-spacing="8" fill="#FFFFFF">AI</text>

  <!-- ===== SOUS-TITRE ===== -->
  <text x="120" y="660" font-family="'Source Serif Pro', Georgia, serif"
        font-weight="400" font-style="italic" font-size="44" fill="#5A6B7A">When Judgment Becomes</text>
  <text x="120" y="710" font-family="'Source Serif Pro', Georgia, serif"
        font-weight="400" font-style="italic" font-size="44" fill="#5A6B7A">Automated</text>

  <!-- ===== SYMBOLE : TRANSITION HUMAIN → SYSTÈME → AGENT (y ~800) =====
       Trois cercles reliés. L'humain (gauche) diminue, l'agent (droite) croît. -->
  <g id="symbole-transition">
    <!-- Connecteurs -->
    <line x1="160" y1="800" x2="280" y2="800" stroke="#5A6B7A" stroke-width="4" stroke-dasharray="14,8"/>
    <line x1="360" y1="800" x2="480" y2="800" stroke="#5A6B7A" stroke-width="4" stroke-dasharray="14,8"/>
    <polygon points="265,790 285,800 265,810 272,800" fill="#5A6B7A" opacity="0.6"/>
    <polygon points="465,790 485,800 465,810 472,800" fill="#5A6B7A" opacity="0.6"/>

    <!-- Humain (gauche) : grand contour acier -->
    <circle cx="115" cy="800" r="55" fill="none" stroke="#5A6B7A" stroke-width="7"/>
    <!-- Système (centre) : émeraude moyen -->
    <circle cx="320" cy="800" r="35" fill="#1F7A5A"/>
    <!-- Agent (droite) : grand contour vert croissant + cœur -->
    <circle cx="525" cy="800" r="60" fill="none" stroke="#1F7A5A" stroke-width="8"/>
    <circle cx="525" cy="800" r="26" fill="#1F7A5A"/>

    <!-- Seuil de passage de contrôle : marqueur turquoise -->
    <rect x="306" y="748" width="28" height="10" fill="#1CB5A0"/>
  </g>

  <!-- ===== AUTEUR ===== -->
  <text x="70" y="895" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="400" font-size="34" letter-spacing="13" fill="#0A1A2F">BA-NDOUWE STEVE</text>
  <text x="70" y="930" font-family="'Source Serif Pro', Georgia, serif"
        font-weight="300" font-style="italic" font-size="28" fill="#5A6B7A">Systems Engineer · Incident Analyst</text>

  <!-- ===== SIGNATURE DAILYOPS ===== -->
  <g transform="translate(515, 868)">
    <rect x="0" y="0" width="38" height="38" fill="#1CB5A0" rx="4"/>
    <text x="55" y="38" font-family="Sora, 'Space Grotesk', sans-serif"
          font-weight="300" font-size="22" letter-spacing="7" fill="#5A6B7A">DAILYOPS</text>
  </g>

</svg>
