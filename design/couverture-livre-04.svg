<?xml version="1.0" encoding="UTF-8"?>
<!--
  Couverture — The Age of Operational AI (Livre 4)
  Design System : Technical Editorial / Dark Precision
  Format : 6" x 9" (152 x 229 mm), fond pleine page.
  Symbole : TRANSITION HUMAIN → SYSTÈME → AGENT — trois cercles reliés,
            l'humain diminue, l'agent croît. Le passage de contrôle.
  Accent livre 4 : Vert émeraude #1F7A5A.
  Date : 2026
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xml:lang="en"
     width="152mm" height="229mm"
     viewBox="0 0 152 229">

  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="light">
        <feFuncA type="linear" slope="0.06"/>
      </feComponentTransfer>
      <feComposite in="light" in2="SourceGraphic" operator="in" result="tex"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="tex"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="152" height="229" fill="#F7F5F0" filter="url(#paper)"/>

  <!-- ===== BANDEAU SUPÉRIEUR ===== -->
  <rect x="0" y="0" width="152" height="26" fill="#0A1A2F"/>
  <text x="16" y="17" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="300" font-size="7pt" letter-spacing="4" fill="#1CB5A0">DAILYOPS</text>
  <text x="136" y="17" text-anchor="end" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="300" font-size="6pt" letter-spacing="2" fill="#5A6B7A" opacity="0.75">THE OPERATOR'S LIBRARY — BOOK 04</text>

  <!-- ===== BLOC TITRE ===== -->
  <rect x="16" y="50" width="120" height="92" fill="#0A1A2F"/>
  <rect x="16" y="50" width="120" height="2.2" fill="#1CB5A0"/>

  <text x="28" y="84" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="800" font-size="28pt" letter-spacing="1.5" fill="#FFFFFF">THE AGE</text>
  <text x="28" y="104" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="300" font-size="13pt" letter-spacing="6" fill="#1F7A5A">OF OPERATIONAL</text>
  <text x="28" y="136" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="800" font-size="30pt" letter-spacing="2" fill="#FFFFFF">AI</text>

  <!-- ===== SOUS-TITRE ===== -->
  <text x="28" y="158" font-family="'Source Serif Pro', Georgia, serif"
        font-weight="400" font-style="italic" font-size="10.5pt" fill="#5A6B7A">When Judgment Becomes</text>
  <text x="28" y="170" font-family="'Source Serif Pro', Georgia, serif"
        font-weight="400" font-style="italic" font-size="10.5pt" fill="#5A6B7A">Automated</text>

  <!-- ===== SYMBOLE : TRANSITION HUMAIN → SYSTÈME → AGENT =====
       Trois cercles reliés en séquence. L'humain (gauche) diminue,
       l'agent (droite) croît. Le contrôle se déplace vers la droite. -->
  <g id="symbole-transition">
    <!-- Connecteurs -->
    <line x1="34" y1="188" x2="62" y2="188" stroke="#5A6B7A" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="90" y1="188" x2="118" y2="188" stroke="#5A6B7A" stroke-width="1" stroke-dasharray="3,2"/>

    <!-- Flèches directionnelles subtiles (sens du passage de contrôle) -->
    <polygon points="50,184.5 55,188 50,191.5 52,188" fill="#5A6B7A" opacity="0.6"/>
    <polygon points="106,184.5 111,188 106,191.5 108,188" fill="#5A6B7A" opacity="0.6"/>

    <!-- Humain (gauche) : grand cercle acier, diminue -->
    <circle cx="26" cy="188" r="8" fill="none" stroke="#5A6B7A" stroke-width="1.4"/>
    <!-- Système (centre) : cercle émeraude moyen -->
    <circle cx="76" cy="188" r="5" fill="#1F7A5A"/>
    <!-- Agent (droite) : grand cercle vert croissant, contour renforcé -->
    <circle cx="126" cy="188" r="9" fill="none" stroke="#1F7A5A" stroke-width="1.6"/>
    <circle cx="126" cy="188" r="4" fill="#1F7A5A"/>

    <!-- Marqueur turquoise : le seuil de passage de contrôle -->
    <rect x="73" y="180" width="6" height="2" fill="#1CB5A0"/>
  </g>

  <!-- ===== AUTEUR ===== -->
  <text x="16" y="212" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="400" font-size="8pt" letter-spacing="3" fill="#0A1A2F">BA-NDOUWE STEVE</text>
  <text x="16" y="221" font-family="'Source Serif Pro', Georgia, serif"
        font-weight="300" font-style="italic" font-size="7pt" fill="#5A6B7A">Systems Engineer · Incident Analyst</text>

  <!-- ===== SIGNATURE DAILYOPS ===== -->
  <g transform="translate(122, 205)">
    <rect x="0" y="0" width="9" height="9" fill="#1CB5A0" rx="1"/>
    <text x="13" y="9" font-family="Sora, 'Space Grotesk', sans-serif"
          font-weight="300" font-size="5.5pt" letter-spacing="1.5" fill="#5A6B7A">DAILYOPS</text>
  </g>

</svg>
