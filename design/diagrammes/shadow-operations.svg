<?xml version="1.0" encoding="UTF-8"?>
<!--
  Diagramme conceptuel — Shadow Operations (Beyond the Firewall, ch. 3)
  Design System section 7 : trait fin (1 pt), style blueprint,
  gris acier + bleu acier (livre 1) + turquoise discret, sans ombres ni dégradés.
  Légende : Source Serif Pro 10 pt, gris acier.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="400"
     viewBox="0 0 800 400"
     fill="none">

  <!-- Titre du diagramme -->
  <text x="40" y="40"
        font-family="Sora, sans-serif"
        font-weight="600"
        font-size="16"
        letter-spacing="2"
        fill="#0A1A2F">
    THE TWO ARCHITECTURES
  </text>

  <!-- ARCHITECTURE A : la documentation -->
  <text x="60" y="100"
        font-family="Sora, sans-serif"
        font-weight="400"
        font-size="12"
        letter-spacing="1"
        fill="#5A6B7A">
    WHAT WE DOCUMENT
  </text>

  <!-- Pas de dépendances visibles : 3 nœuds simples -->
  <circle cx="150" cy="150" r="20" stroke="#5A6B7A" stroke-width="1.5" fill="#F7F5F0"/>
  <circle cx="400" cy="150" r="20" stroke="#5A6B7A" stroke-width="1.5" fill="#F7F5F0"/>
  <circle cx="650" cy="150" r="20" stroke="#5A6B7A" stroke-width="1.5" fill="#F7F5F0"/>
  <line x1="170" y1="150" x2="380" y2="150" stroke="#5A6B7A" stroke-width="1.5"/>
  <line x1="420" y1="150" x2="630" y2="150" stroke="#5A6B7A" stroke-width="1.5"/>

  <!-- ARCHITECTURE B : le shadow ops, en pointillés -->
  <text x="60" y="235"
        font-family="Sora, sans-serif"
        font-weight="400"
        font-size="12"
        letter-spacing="1"
        fill="#2C5F8A">
    WHAT ACTUALLY RUNS
  </text>

  <!-- Réseau dense et secret : points et liens pointillés -->
  <circle cx="120" cy="280" r="12" stroke="#2C5F8A" stroke-width="1.5" fill="none" stroke-dasharray="3 3"/>
  <circle cx="240" cy="265" r="12" stroke="#2C5F8A" stroke-width="1.5" fill="none" stroke-dasharray="3 3"/>
  <circle cx="360" cy="300" r="12" stroke="#2C5F8A" stroke-width="1.5" fill="none" stroke-dasharray="3 3"/>
  <circle cx="480" cy="270" r="12" stroke="#2C5F8A" stroke-width="1.5" fill="none" stroke-dasharray="3 3"/>
  <circle cx="600" cy="295" r="12" stroke="#2C5F8A" stroke-width="1.5" fill="none" stroke-dasharray="3 3"/>
  <circle cx="700" cy="275" r="12" stroke="#2C5F8A" stroke-width="1.5" fill="none" stroke-dasharray="3 3"/>

  <!-- Liens "secrets" -->
  <line x1="132" y1="276" x2="228" y2="268" stroke="#2C5F8A" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="252" y1="268" x2="348" y2="294" stroke="#2C5F8A" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="372" y1="292" x2="468" y2="274" stroke="#2C5F8A" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="492" y1="274" x2="588" y2="290" stroke="#2C5F8A" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="612" y1="290" x2="688" y2="278" stroke="#2C5F8A" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Marqueur "caché" au centre : carré turquoise -->
  <rect x="388" y="257" width="8" height="8" fill="#1CB5A0"/>

  <!-- Légende -->
  <text x="40" y="355"
        font-family="Sora, sans-serif" font-weight="400" font-size="10" fill="#5A6B7A">
    Solid line = the architecture we think we run. Dotted line = the one we actually run.
  </text>

  <text x="40" y="392"
        font-family="'Source Serif Pro', serif" font-size="10.5" fill="#5A6B7A">
    Fig. 3 — Shadow operations: an undocumented parallel architecture, invisible to monitoring and to memory.
  </text>

</svg>