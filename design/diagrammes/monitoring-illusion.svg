<?xml version="1.0" encoding="UTF-8"?>
<!--
  Diagramme conceptuel — Monitoring Illusion (Beyond the Firewall, ch. 5)
  Design System section 7 : trait fin (1 pt), style blueprint,
  gris acier + bleu acier (livre 1) + turquoise discret, sans ombres ni dégradés.
  Légende : Source Serif Pro 10 pt, gris acier.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="400"
     viewBox="0 0 800 400"
     fill="none">

  <!-- Titre du diagramme -->
  <text x="40" y="40"
        font-family="Sora, sans-serif"
        font-weight="600"
        font-size="16"
        letter-spacing="2"
        fill="#0A1A2F">
    MONITORING ILLUSION
  </text>

  <!-- Bandeau "dashboards verts" : ligne plate stable le long du haut -->
  <text x="60" y="95"
        font-family="Sora, sans-serif"
        font-weight="400"
        font-size="12"
        letter-spacing="1"
        fill="#5A6B7A">
    WHAT WE MEASURE
  </text>
  <line x1="60" y1="130" x2="720" y2="130"
        stroke="#2C5F8A" stroke-width="2" stroke-linecap="square"/>

  <!-- Petits indicateurs "verts" : carrés le long de la ligne -->
  <rect x="120" y="122" width="8" height="8" fill="#1CB5A0"/>
  <rect x="220" y="122" width="8" height="8" fill="#1CB5A0"/>
  <rect x="320" y="122" width="8" height="8" fill="#1CB5A0"/>
  <rect x="420" y="122" width="8" height="8" fill="#1CB5A0"/>
  <rect x="520" y="122" width="8" height="8" fill="#1CB5A0"/>
  <rect x="620" y="122" width="8" height="8" fill="#1CB5A0"/>

  <!-- Ce qui compte vraiment : courbe qui chute dans la zone basse -->
  <text x="60" y="195"
        font-family="Sora, sans-serif"
        font-weight="400"
        font-size="12"
        letter-spacing="1"
        fill="#0A1A2F">
    WHAT MATTERS
  </text>
  <line x1="60" y1="230" x2="200" y2="230"
        stroke="#5A6B7A" stroke-width="2" stroke-linecap="square"/>
  <line x1="200" y1="230" x2="340" y2="300"
        stroke="#5A6B7A" stroke-width="2" stroke-linecap="square"/>
  <rect x="336" y="296" width="10" height="10" fill="#A83A3A"/>

  <!-- Zone d'écart entre les deux courbes -->
  <line x1="340" y1="130" x2="340" y2="296" stroke="#5A6B7A" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="352" y="225"
        font-family="Sora, sans-serif"
        font-weight="400"
        font-size="10"
        fill="#A83A3A">
    THE GAP
  </text>

  <!-- Légende -->
  <text x="40" y="340"
        font-family="Sora, sans-serif"
        font-weight="400"
        font-size="10"
        fill="#5A6B7A">
    Green
  </text>
  <rect x="80" y="334" width="8" height="8" fill="#1CB5A0"/>
  <text x="96" y="340"
        font-family="Sora, sans-serif"
        font-weight="400"
        font-size="10"
        fill="#5A6B7A">
    : monitored metrics stay green
  </text>
  <text x="250" y="340"
        font-family="Sora, sans-serif"
        font-weight="400"
        font-size="10"
        fill="#5A6B7A">
    The Gap
  </text>
  <text x="290" y="340"
        font-family="Sora, sans-serif"
        font-weight="400"
        font-size="10"
        fill="#A83A3A">
    ■
  </text>
  <text x="306" y="340"
        font-family="Sora, sans-serif"
        font-weight="400"
        font-size="10"
        fill="#5A6B7A">
    : silent degradation of experience
  </text>

  <line x1="60" y1="360" x2="720" y2="360" stroke="#5A6B7A" stroke-width="1"/>
  <text x="40" y="392"
        font-family="'Source Serif Pro', serif"
        font-size="10.5"
        fill="#5A6B7A">
    Fig. 5 — Monitoring illusion: the metrics we watch stay flat while the experience we deliver collapses.
  </text>

</svg>