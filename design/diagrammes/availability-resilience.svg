<?xml version="1.0" encoding="UTF-8"?>
<!--
  Diagramme conceptuel — Availability ≠ Resilience (Beyond the Firewall, ch. 6)
  Design System section 7 : trait fin (1 pt), style blueprint,
  gris acier + bleu acier (livre 1) + turquoise discret, sans ombres ni dégradés.
  Légende : Source Serif Pro 10 pt, gris acier.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="400"
     viewBox="0 0 800 400"
     fill="none">

  <!-- Titre du diagramme -->
  <text x="40" y="40"
        font-family="Sora, sans-serif"
        font-weight="600"
        font-size="16"
        letter-spacing="2"
        fill="#0A1A2F">
    AVAILABILITY ≠ RESILIENCE
  </text>

  <!-- PARTIE A : la plateforme "toujours up" -->
  <text x="60" y="100"
        font-family="Sora, sans-serif"
        font-weight="400"
        font-size="12"
        letter-spacing="1"
        fill="#5A6B7A">
    PART A — ALWAYS UP
  </text>

  <!-- Ligne d'uptime : plate et "verte" -->
  <line x1="60" y1="135" x2="700" y2="135"
        stroke="#2C5F8A" stroke-width="2" stroke-linecap="square"/>
  <rect x="120" y="128" width="8" height="8" fill="#1CB5A0"/>
  <rect x="260" y="128" width="8" height="8" fill="#1CB5A0"/>
  <rect x="400" y="128" width="8" height="8" fill="#1CB5A0"/>
  <rect x="540" y="128" width="8" height="8" fill="#1CB5A0"/>
  <text x="60" y="165"
        font-family="Sora, sans-serif"
        font-weight="400"
        font-size="10"
        fill="#5A6B7A">
    99.99% uptime — nothing ever failed
  </text>

  <!-- PARTIE B : le premier vrai test -->
  <text x="60" y="220"
        font-family="Sora, sans-serif"
        font-weight="400"
        font-size="12"
        letter-spacing="1"
        fill="#5A6B7A">
    PART B — THE FIRST REAL TEST
  </text>

  <!-- Ligne qui explose au premier incident -->
  <line x1="60" y1="255" x2="300" y2="255"
        stroke="#5A6B7A" stroke-width="2" stroke-linecap="square"/>
  <line x1="300" y1="255" x2="420" y2="330"
        stroke="#A83A3A" stroke-width="2" stroke-linecap="square"/>
  <rect x="416" y="326" width="10" height="10" fill="#A83A3A"/>

  <text x="60" y="370"
        font-family="Sora, sans-serif"
        font-weight="400"
        font-size="10"
        fill="#A83A3A">
    First failure = first test. Uptime never proved resilience.
  </text>

  <!-- Légende -->
  <text x="40" y="395"
        font-family="'Source Serif Pro', serif"
        font-size="10.5"
        fill="#5A6B7A">
    Fig. 6 — Working is an event. Reliability is a property. A system that never fails has never been tested.
  </text>

</svg>