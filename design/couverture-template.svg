<?xml version="1.0" encoding="UTF-8"?>
<!--
  couverture-template.svg — The Operator's Library
  Gabarit de couverture réutilisable (collection de 5 livres).
  Design System : Technical Editorial / Dark Precision
  Format : 6" x 9" (152 x 229 mm) + fond pleine page.

  Paramètres à substituer par livre :
    ACCENT       = couleur d'accent du livre (hex sans #)
    BOOK-NUM     = numéro (01..05)
    BRAND        = "DAILYOPS" (livre 1-2) | "THE OPERATOR'S LIBRARY" (livre 3+)
    TITLE-L1/L2  = lignes du titre principal
    SUBTITLE-L1  = ligne 1 du sous-titre
    SUBTITLE-L2  = ligne 2 du sous-titre (optionnel)
    AUTHOR       = nom de l'auteur
    AUTHOR-ROLE  = fonction / spécialité
    SYMBOLE      = groupe <g id="symbole"> à remplacer par le motif conceptuel du livre

  Règles de la collection (charte-graphique.md §5) :
    - Gabarit vertical identique : marque → titre → symbole → auteur + signature.
    - Symbole conceptuel abstrait, trait fin, couleur d'accent du livre.
    - Jamais d'ordinateurs, cadenas, circuits imprimés, code décoratif, hackers.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xml:lang="en"
     width="152mm" height="229mm"
     viewBox="0 0 152 229">

  <defs>
    <!-- Texture papier subtile (off-white) -->
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="light">
        <feFuncA type="linear" slope="0.06"/>
      </feComponentTransfer>
      <feComposite in="light" in2="SourceGraphic" operator="in" result="tex"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="tex"/></feMerge>
    </filter>
  </defs>

  <!-- Fond : Off-white texturé -->
  <rect x="0" y="0" width="152" height="229" fill="#F7F5F0" filter="url(#paper)"/>

  <!-- ===== BANDEAU SUPÉRIEUR : marque éditoriale ===== -->
  <rect x="0" y="0" width="152" height="26" fill="#0A1A2F"/>
  <text x="16" y="17"
        font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="300" font-size="7pt" letter-spacing="4"
        fill="#1CB5A0">DAILYOPS</text>
  <text x="136" y="17" text-anchor="end"
        font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="300" font-size="6pt" letter-spacing="2"
        fill="#5A6B7A" opacity="0.75">THE OPERATOR'S LIBRARY — BOOK ##</text>

  <!-- ===== BLOC TITRE PRINCIPAL (Deep Navy, asymétrique gauche) ===== -->
  <rect x="16" y="50" width="120" height="92" fill="#0A1A2F"/>
  <!-- ACCENT : ligne fine turquoise = signature de collection -->
  <rect x="16" y="50" width="120" height="2.2" fill="#1CB5A0"/>

  <!-- Ligne 1 du titre -->
  <text x="28" y="82"
        font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="800" font-size="30pt" letter-spacing="1.5"
        fill="#FFFFFF">TITLE-L1</text>
  <!-- Ligne 2 du titre (optionnel) -->
  <text x="28" y="128"
        font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="700" font-size="26pt" letter-spacing="1"
        fill="#FFFFFF">TITLE-L2</text>

  <!-- ===== SOUS-TITRE ===== -->
  <text x="28" y="158"
        font-family="'Source Serif Pro', Georgia, serif"
        font-weight="400" font-style="italic" font-size="10.5pt"
        fill="#5A6B7A">SUBTITLE-L1</text>
  <text x="28" y="170"
        font-family="'Source Serif Pro', Georgia, serif"
        font-weight="400" font-style="italic" font-size="10.5pt"
        fill="#5A6B7A">SUBTITLE-L2</text>

  <!-- ===== SYMBOLE CONCEPTUEL =====
       Remplacer le groupe ci-dessous par le motif du livre.
       Cadre d'emplacement : x 16–136, y 178–196 -->
  <g id="symbole">
    <!-- Ligne de base acier traversante (placeholder) -->
    <line x1="16" y1="188" x2="136" y2="188"
          stroke="#5A6B7A" stroke-width="1.2" stroke-linecap="round"
          stroke-dasharray="8,4"/>
    <circle cx="76" cy="188" r="3" fill="#1CB5A0"/>
  </g>

  <!-- ===== BLOC AUTEUR (bas gauche) ===== -->
  <text x="16" y="212"
        font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="400" font-size="8pt" letter-spacing="3"
        fill="#0A1A2F">AUTHOR</text>
  <text x="16" y="221"
        font-family="'Source Serif Pro', Georgia, serif"
        font-weight="300" font-style="italic" font-size="7pt"
        fill="#5A6B7A">AUTHOR-ROLE</text>

  <!-- ===== SIGNATURE DAILYOPS (bas droite) ===== -->
  <g transform="translate(122, 205)">
    <rect x="0" y="0" width="9" height="9" fill="#1CB5A0" rx="1"/>
    <text x="13" y="9"
          font-family="Sora, 'Space Grotesk', sans-serif"
          font-weight="300" font-size="5.5pt" letter-spacing="1.5"
          fill="#5A6B7A">DAILYOPS</text>
  </g>

</svg>
