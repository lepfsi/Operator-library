<?xml version="1.0" encoding="UTF-8"?>
<!--
  couverture-template.svg — The Operator's Library
  Reusable cover master: Operational Ideas / Saffron, Ink, Bone
  Format: 6 × 9 in (152.4 × 228.6 mm), viewBox 1200 × 1800.

  Substitute per book:
    BOOK-NUM, TITLE-L1, TITLE-L2, TITLE-L3,
    SUBTITLE-L1, SUBTITLE-L2, AUTHOR, AUTHOR-ROLE,
    SYMBOL = the one abstract graphic metaphor of the book.

  Collection rules:
    - Bone background, Ink title, Saffron only at the decision/breach point.
    - One symbolic graphic form; never a computer, lock, code, server or faux UI.
    - Title is the primary image and must remain readable at 120 px high.
-->
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en"
     width="152.4mm" height="228.6mm" viewBox="0 0 1200 1800">
  <defs>
    <pattern id="paper-grain" width="110" height="110" patternUnits="userSpaceOnUse">
      <path d="M0 22H110M0 88H110M28 0V110M82 0V110" fill="none" stroke="#948E84" stroke-width="0.55" opacity="0.13"/>
    </pattern>
  </defs>

  <rect width="1200" height="1800" fill="#F2EDE3"/>
  <rect width="1200" height="1800" fill="url(#paper-grain)"/>

  <!-- Book-specific symbol field. Replace only this group. -->
  <g id="symbol">
    <path d="M818 0 H1200 V1800 H795 L809 1660 L788 1518 L810 1386 L784 1240 L806 1090 L780 948 L805 808 L778 660 L800 510 L775 355 L797 214 Z" fill="#161616"/>
    <path d="M797 0 L818 0 L797 214 L775 355 L800 510 L778 660 L805 808 L780 948 L806 1090 L784 1240 L810 1386 L788 1518 L809 1660 L795 1800 L777 1800 L791 1660 L770 1518 L792 1386 L766 1240 L788 1090 L762 948 L787 808 L760 660 L782 510 L757 355 L779 214 Z" fill="#F2A900"/>
    <g fill="none" stroke="#948E84" stroke-width="1.2" opacity="0.65"><circle cx="626" cy="886" r="284"/><path d="M72 886H648"/><path d="M626 490V1282"/></g>
    <circle cx="626" cy="886" r="23" fill="#F2EDE3" stroke="#161616" stroke-width="3"/>
    <circle cx="626" cy="886" r="8" fill="#1C6B5A"/>
    <path d="M72 886H583 M669 886H750" stroke="#161616" stroke-width="4"/>
    <path d="M777 850V922" stroke="#F2A900" stroke-width="9"/>
  </g>

  <text x="72" y="91" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="4.3">THE OPERATOR’S LIBRARY</text>
  <text x="1130" y="91" text-anchor="end" fill="#F2EDE3" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="3">BOOK-NUM</text>
  <line x1="72" y1="125" x2="748" y2="125" stroke="#161616" stroke-width="2"/>
  <line x1="818" y1="125" x2="1130" y2="125" stroke="#F2A900" stroke-width="3"/>

  <g transform="translate(72,392)">
    <text x="0" y="0" fill="#1C6B5A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="4.4">SERIES ESSAY</text>
    <text x="0" y="188" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="156" font-weight="700" letter-spacing="-6">TITLE-L1</text>
    <text x="5" y="282" fill="#F2A900" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" letter-spacing="24">TITLE-L2</text>
    <text x="0" y="438" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="122" font-weight="700" letter-spacing="-5">TITLE-L3</text>
  </g>

  <line x1="72" y1="1053" x2="458" y2="1053" stroke="#F2A900" stroke-width="9"/>
  <text x="72" y="1138" fill="#161616" font-family="Georgia, 'Times New Roman', serif" font-size="39" font-style="italic">SUBTITLE-L1</text>
  <text x="72" y="1188" fill="#161616" font-family="Georgia, 'Times New Roman', serif" font-size="39" font-style="italic">SUBTITLE-L2</text>

  <line x1="72" y1="1608" x2="748" y2="1608" stroke="#161616" stroke-width="1.4"/>
  <text x="72" y="1682" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" letter-spacing="7">AUTHOR</text>
  <text x="72" y="1727" fill="#948E84" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic">AUTHOR-ROLE</text>
  <text x="1130" y="1682" text-anchor="end" fill="#F2A900" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="3">OPERATIONAL IDEAS</text>
</svg>
