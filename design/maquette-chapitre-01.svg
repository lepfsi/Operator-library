<?xml version="1.0" encoding="UTF-8"?>
<!--
  maquette-chapitre-01.svg — The Operator's Library
  Maquette visuelle du Chapitre 1 « Beyond the Firewall » selon le déroulé
  éditorial en 10 pages. Montre les 4 pages-clés du rythme :
   1. Page d'ouverture noire (verso) — grand numéro + titre
   2. Page d'impact (recto) — citation centrée, filet, pas de folio
   3. Page CONCEPT / WARNING — récit + callouts pleine largeur
   4. Page FIELD NOTE (fond noir) — synthèse terrain, texte blanc
  Format : 6" x 9" par page (viewBox 0 0 640 960), grille 2x2.
  Direction : Technical Editorial / Dark Precision. Accent livre 1 (#2C5F8A).
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xml:lang="fr"
     width="304mm" height="458mm"
     viewBox="0 0 1280 1920">

  <rect x="0" y="0" width="1280" height="1920" fill="#E8E5DE"/>

  <!-- ===================== PAGE 1 : OUVERTURE NOIRE ===================== -->
  <g transform="translate(20,20)">
    <rect x="0" y="0" width="600" height="920" fill="#1E2229"/>
    <!-- Grand numéro 01, blanc opacité 15% -->
    <text x="560" y="520" text-anchor="end" font-family="Sora, sans-serif"
          font-weight="800" font-size="380" fill="#FFFFFF" opacity="0.15">01</text>
    <!-- Titre du livre, bas-droite, blanc -->
    <text x="560" y="820" text-anchor="end" font-family="Sora, sans-serif"
          font-weight="700" font-size="52" fill="#FFFFFF">BEYOND THE FIREWALL</text>
    <!-- Label page -->
    <text x="300" y="890" text-anchor="middle" font-family="Sora, sans-serif"
          font-weight="300" font-size="13" letter-spacing="2" fill="#5A6B7A">PAGE 1 — Ouverture noire (verso)</text>
  </g>

  <!-- ===================== PAGE 2 : PAGE D'IMPACT ===================== -->
  <g transform="translate(660,20)">
    <rect x="0" y="0" width="600" height="920" fill="#F9FAFC"/>
    <!-- Citation centrée, Source Serif Pro italic -->
    <text x="300" y="430" text-anchor="middle" font-family="'Source Serif Pro', Georgia, serif"
          font-style="italic" font-size="48" fill="#0A1A2F">« Le pare-feu fonctionnait.</text>
    <text x="300" y="500" text-anchor="middle" font-family="'Source Serif Pro', Georgia, serif"
          font-style="italic" font-size="48" fill="#0A1A2F">L’entreprise, non. »</text>
    <!-- Filet décoratif 30mm -->
    <line x1="230" y1="540" x2="370" y2="540" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="300" y="890" text-anchor="middle" font-family="Sora, sans-serif"
          font-weight="300" font-size="13" letter-spacing="2" fill="#5A6B7A">PAGE 2 — Impact (pas de folio)</text>
  </g>

  <!-- ===================== PAGE 4 : CONCEPT ===================== -->
  <g transform="translate(20,980)">
    <rect x="0" y="0" width="600" height="920" fill="#F7F5F0"/>
    <!-- Texte courant (traits gris) -->
    <g stroke="#C9CCCE" stroke-width="2">
      <line x1="50" y1="80" x2="550" y2="80"/>
      <line x1="50" y1="98" x2="550" y2="98"/>
      <line x1="50" y1="116" x2="420" y2="116"/>
      <line x1="50" y1="134" x2="550" y2="134"/>
      <line x1="50" y1="152" x2="550" y2="152"/>
      <line x1="50" y1="170" x2="380" y2="170"/>
    </g>

    <!-- Filet séparateur haut -->
    <line x1="50" y1="210" x2="550" y2="210" stroke="#D1D5DB" stroke-width="1"/>

    <!-- DAILYOPS CONCEPT — label small caps -->
    <text x="50" y="240" font-family="Sora, sans-serif"
          font-weight="700" font-size="13" letter-spacing="3" fill="#6B7280">DAILYOPS CONCEPT</text>

    <!-- Nom du concept -->
    <text x="50" y="285" font-family="Sora, sans-serif"
          font-weight="700" font-size="32" fill="#0E7C7B">LE SYSTÈME INVISIBLE</text>

    <!-- Définition (serif) -->
    <text x="50" y="325" font-family="'Source Serif Pro', Georgia, serif"
          font-size="19" fill="#111111">Tout ce qui détermine si le système survit, performe ou</text>
    <text x="50" y="350" font-family="'Source Serif Pro', Georgia, serif"
          font-size="19" fill="#111111">échoue se trouve derrière le pare-feu : les dépendances</text>
    <text x="50" y="375" font-family="'Source Serif Pro', Georgia, serif"
          font-size="19" fill="#111111">internes, les exceptions non documentées, les décisions</text>
    <text x="50" y="400" font-family="'Source Serif Pro', Georgia, serif"
          font-size="19" fill="#111111">prises sous pression.</text>

    <!-- Filet séparateur bas -->
    <line x1="50" y1="430" x2="550" y2="430" stroke="#D1D5DB" stroke-width="1"/>

    <!-- WARNING callout (style site web : label + filet + fond teinté) -->
    <rect x="50" y="470" width="500" height="220" fill="#FFF4F0"/>
    <rect x="50" y="470" width="6" height="220" fill="#E85D3A"/>
    <text x="72" y="500" font-family="Sora, sans-serif"
          font-weight="700" font-size="13" letter-spacing="3" fill="#E85D3A">⚠ WARNING</text>
    <line x1="72" y1="512" x2="528" y2="512" stroke="#E85D3A" stroke-width="0.6" opacity="0.4"/>
    <text x="72" y="545" font-family="'Source Serif Pro', Georgia, serif"
          font-size="18" fill="#111111">La dépendance la plus dangereuse n’est pas un serveur.</text>
    <text x="72" y="572" font-family="'Source Serif Pro', Georgia, serif"
          font-size="18" fill="#111111">C’est l’hypothèse que le pare-feu définit la santé du</text>
    <text x="72" y="599" font-family="'Source Serif Pro', Georgia, serif"
          font-size="18" fill="#111111">système. Les métriques de sécurité ne remplacent</text>
    <text x="72" y="626" font-family="'Source Serif Pro', Georgia, serif"
          font-size="18" fill="#111111">jamais les métriques de fiabilité.</text>

    <!-- Texte courant (suite) -->
    <g stroke="#C9CCCE" stroke-width="2">
      <line x1="50" y1="730" x2="550" y2="730"/>
      <line x1="50" y1="748" x2="550" y2="748"/>
      <line x1="50" y1="766" x2="470" y2="766"/>
    </g>

    <text x="300" y="900" text-anchor="middle" font-family="Sora, sans-serif"
          font-weight="300" font-size="13" letter-spacing="2" fill="#5A6B7A">PAGE 4 — Concept + Warning</text>
  </g>

  <!-- ===================== PAGE 9 : FIELD NOTE NOIRE ===================== -->
  <g transform="translate(660,980)">
    <rect x="0" y="0" width="600" height="920" fill="#1E2229"/>
    <!-- Cadre FIELD NOTE (légèrement plus clair que le fond) -->
    <rect x="40" y="60" width="520" height="760" fill="#262B33"/>
    <rect x="40" y="60" width="520" height="6" fill="#5A6B7A" opacity="0.6"/>

    <!-- Label FIELD NOTE -->
    <text x="64" y="105" font-family="Sora, sans-serif"
          font-weight="700" font-size="13" letter-spacing="6" fill="#FFFFFF">FIELD NOTE</text>
    <line x1="64" y1="118" x2="536" y2="118" stroke="#FFFFFF" stroke-width="0.5" opacity="0.4"/>

    <!-- Champs : intitulé gras blanc, contenu blanc régulier -->
    <text x="64" y="160" font-family="Sora, sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">CONTEXTE</text>
    <text x="64" y="190" font-family="'Source Serif Pro', Georgia, serif" font-size="17" fill="#E8E8E8">Manufacturing Co., Mars 2023. Pannes</text>
    <text x="64" y="214" font-family="'Source Serif Pro', Georgia, serif" font-size="17" fill="#E8E8E8">intermittentes. Tous les dashboards sont verts.</text>

    <text x="64" y="262" font-family="Sora, sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">CE QU’ON ATTENDAIT</text>
    <text x="64" y="292" font-family="'Source Serif Pro', Georgia, serif" font-size="17" fill="#E8E8E8">Des métriques vertes = système sain.</text>

    <text x="64" y="340" font-family="Sora, sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">CE QUI S’EST PASSÉ</text>
    <text x="64" y="370" font-family="'Source Serif Pro', Georgia, serif" font-size="17" fill="#E8E8E8">Les utilisateurs ne peuvent plus valider</text>
    <text x="64" y="394" font-family="'Source Serif Pro', Georgia, serif" font-size="17" fill="#E8E8E8">de commandes. Aucune alerte, aucune intrusion.</text>

    <text x="64" y="442" font-family="Sora, sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">CE QU’ON A RATÉ</text>
    <text x="64" y="472" font-family="'Source Serif Pro', Georgia, serif" font-size="17" fill="#E8E8E8">Une dépendance interne (base de données) avait</text>
    <text x="64" y="496" font-family="'Source Serif Pro', Georgia, serif" font-size="17" fill="#E8E8E8">été déplacée. Le flux applicatif pointait sur</text>
    <text x="64" y="520" font-family="'Source Serif Pro', Georgia, serif" font-size="17" fill="#E8E8E8">l’ancienne adresse.</text>

    <text x="64" y="568" font-family="Sora, sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">CE QUE ÇA NOUS A APPRIS</text>
    <text x="64" y="598" font-family="'Source Serif Pro', Georgia, serif" font-size="17" fill="#E8E8E8">Un périmètre sécurisé ne garantit PAS un</text>
    <text x="64" y="622" font-family="'Source Serif Pro', Georgia, serif" font-size="17" fill="#E8E8E8">business fonctionnel. La santé réelle du système</text>
    <text x="64" y="646" font-family="'Source Serif Pro', Georgia, serif" font-size="17" fill="#E8E8E8">est invisible pour le pare-feu.</text>

    <text x="300" y="890" text-anchor="middle" font-family="Sora, sans-serif"
          font-weight="300" font-size="13" letter-spacing="2" fill="#8A8A8A">PAGE 9 — Field Note (fond noir)</text>
  </g>

</svg>
