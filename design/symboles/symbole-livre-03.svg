<?xml version="1.0" encoding="UTF-8"?>
<!--
  symbole-livre-03.svg — The Complexity Trap : GRAPHE DENSIFIANT
  Motif conceptuel du livre 3. viewBox 0 0 200 100. Fond transparent.
  Palette : gris acier #5A6B7A, violet sombre #5B3E7D, turquoise #1CB5A0.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="200" height="100" viewBox="0 0 200 100">

  <!-- Zone claire (gauche) -->
  <g stroke="#5A6B7A" stroke-width="1.2" fill="none" opacity="0.85">
    <line x1="15" y1="55" x2="40" y2="35"/>
    <line x1="40" y1="35" x2="60" y2="65"/>
    <line x1="15" y1="55" x2="60" y2="65"/>
    <line x1="40" y1="35" x2="70" y2="50"/>
  </g>
  <g fill="#5A6B7A">
    <circle cx="15" cy="55" r="2.5"/>
    <circle cx="40" cy="35" r="2.5"/>
    <circle cx="60" cy="65" r="2.5"/>
    <circle cx="70" cy="50" r="2.5"/>
  </g>

  <!-- Seuil de complexité : ligne turquoise -->
  <line x1="88" y1="20" x2="88" y2="80" stroke="#1CB5A0" stroke-width="1"
        stroke-dasharray="3,3" opacity="0.6"/>

  <!-- Zone dense (droite) -->
  <g stroke="#5B3E7D" stroke-width="0.9" fill="none" opacity="0.8">
    <line x1="110" y1="40" x2="130" y2="30"/>
    <line x1="110" y1="40" x2="150" y2="55"/>
    <line x1="110" y1="40" x2="175" y2="35"/>
    <line x1="110" y1="40" x2="185" y2="60"/>
    <line x1="130" y1="30" x2="150" y2="55"/>
    <line x1="130" y1="30" x2="175" y2="35"/>
    <line x1="130" y1="30" x2="185" y2="60"/>
    <line x1="150" y1="55" x2="175" y2="35"/>
    <line x1="150" y1="55" x2="185" y2="60"/>
    <line x1="175" y1="35" x2="185" y2="60"/>
    <line x1="150" y1="55" x2="170" y2="75"/>
    <line x1="175" y1="35" x2="170" y2="75"/>
    <line x1="130" y1="30" x2="170" y2="75"/>
    <line x1="110" y1="40" x2="170" y2="75"/>
    <line x1="170" y1="75" x2="185" y2="60"/>
  </g>
  <g fill="#5B3E7D">
    <circle cx="110" cy="40" r="2.2"/>
    <circle cx="130" cy="30" r="2.2"/>
    <circle cx="150" cy="55" r="2.2"/>
    <circle cx="175" cy="35" r="2.2"/>
    <circle cx="170" cy="75" r="2.2"/>
    <circle cx="185" cy="60" r="2.2"/>
  </g>

  <text x="38" y="92" font-family="Sora, sans-serif" font-size="7" letter-spacing="2"
        fill="#5A6B7A" text-anchor="middle">LEGIBLE</text>
  <text x="145" y="92" font-family="Sora, sans-serif" font-size="7" letter-spacing="2"
        fill="#5B3E7D" text-anchor="middle">INTRICATE</text>
</svg>
