<?xml version="1.0" encoding="UTF-8"?>
<!--
  Couverture — The Complexity Trap (Livre 3)
  Design System : Technical Editorial / Dark Precision
  Format : 6" x 9" (152 x 229 mm). Grille en pixels (viewBox 0 0 640 960), ratio 6:9.
  Symbole : GRAPHE DENSIFIANT — maillage clair qui devient enchevêtrement.
  Accent livre 3 : Violet sombre #5B3E7D.
  Date : 2026
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xml:lang="en"
     width="152mm" height="229mm"
     viewBox="0 0 640 960">

  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="light">
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite in="light" in2="SourceGraphic" operator="in" result="tex"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="tex"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="640" height="960" fill="#F7F5F0" filter="url(#paper)"/>

  <!-- ===== BANDEAU SUPÉRIEUR ===== -->
  <rect x="0" y="0" width="640" height="110" fill="#0A1A2F"/>
  <text x="70" y="70" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="300" font-size="30" letter-spacing="18" fill="#1CB5A0">DAILYOPS</text>
  <text x="570" y="70" text-anchor="end" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="300" font-size="24" letter-spacing="9" fill="#5A6B7A" opacity="0.75">THE OPERATOR'S LIBRARY — BOOK 03</text>

  <!-- ===== BLOC TITRE ===== -->
  <rect x="70" y="200" width="500" height="390" fill="#0A1A2F"/>
  <rect x="70" y="200" width="500" height="9" fill="#1CB5A0"/>

  <text x="120" y="330" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="800" font-size="118" letter-spacing="3" fill="#FFFFFF">THE</text>
  <text x="120" y="470" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="800" font-size="68" letter-spacing="3" fill="#FFFFFF">COMPLEXITY</text>
  <text x="120" y="560" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="700" font-size="92" letter-spacing="3" fill="#5B3E7D">TRAP</text>

  <!-- ===== SOUS-TITRE ===== -->
  <text x="120" y="660" font-family="'Source Serif Pro', Georgia, serif"
        font-weight="400" font-style="italic" font-size="44" fill="#5A6B7A">When Systems Outgrow</text>
  <text x="120" y="710" font-family="'Source Serif Pro', Georgia, serif"
        font-weight="400" font-style="italic" font-size="44" fill="#5A6B7A">Their Owners</text>

  <!-- ===== SYMBOLE : GRAPHE DENSIFIANT (x 70..570, y ~735..855) =====
       Gauche : maillage clair. Droite : enchevêtrement dense. -->
  <g id="symbole-complexite">
    <!-- Zone claire (gauche) -->
    <g stroke="#5A6B7A" stroke-width="3.5" fill="none" opacity="0.85">
      <line x1="90" y1="800" x2="130" y2="760"/>
      <line x1="130" y1="760" x2="185" y2="825"/>
      <line x1="90" y1="800" x2="185" y2="825"/>
      <line x1="130" y1="760" x2="215" y2="790"/>
    </g>
    <g fill="#5A6B7A">
      <circle cx="90" cy="800" r="6"/>
      <circle cx="130" cy="760" r="6"/>
      <circle cx="185" cy="825" r="6"/>
      <circle cx="215" cy="790" r="6"/>
    </g>

    <!-- Seuil de complexité : ligne turquoise verticale -->
    <line x1="270" y1="720" x2="270" y2="860" stroke="#1CB5A0" stroke-width="3"
          stroke-dasharray="8,8" opacity="0.6"/>

    <!-- Zone dense (droite) -->
    <g stroke="#5B3E7D" stroke-width="2.5" fill="none" opacity="0.8">
      <line x1="320" y1="785" x2="380" y2="745"/>
      <line x1="320" y1="785" x2="440" y2="815"/>
      <line x1="320" y1="785" x2="510" y2="755"/>
      <line x1="320" y1="785" x2="560" y2="830"/>
      <line x1="380" y1="745" x2="440" y2="815"/>
      <line x1="380" y1="745" x2="510" y2="755"/>
      <line x1="380" y1="745" x2="560" y2="830"/>
      <line x1="440" y1="815" x2="510" y2="755"/>
      <line x1="440" y1="815" x2="560" y2="830"/>
      <line x1="510" y1="755" x2="560" y2="830"/>
      <line x1="440" y1="815" x2="530" y2="855"/>
      <line x1="510" y1="755" x2="530" y2="855"/>
      <line x1="380" y1="745" x2="530" y2="855"/>
      <line x1="320" y1="785" x2="530" y2="855"/>
      <line x1="530" y1="855" x2="560" y2="830"/>
    </g>
    <g fill="#5B3E7D">
      <circle cx="320" cy="785" r="5.5"/>
      <circle cx="380" cy="745" r="5.5"/>
      <circle cx="440" cy="815" r="5.5"/>
      <circle cx="510" cy="755" r="5.5"/>
      <circle cx="530" cy="855" r="5.5"/>
      <circle cx="560" cy="830" r="5.5"/>
    </g>
  </g>

  <!-- ===== AUTEUR ===== -->
  <text x="70" y="895" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="400" font-size="34" letter-spacing="13" fill="#0A1A2F">BA-NDOUWE STEVE</text>
  <text x="70" y="930" font-family="'Source Serif Pro', Georgia, serif"
        font-weight="300" font-style="italic" font-size="28" fill="#5A6B7A">Systems Engineer · Incident Analyst</text>

  <!-- ===== SIGNATURE DAILYOPS ===== -->
  <g transform="translate(515, 868)">
    <rect x="0" y="0" width="38" height="38" fill="#1CB5A0" rx="4"/>
    <text x="55" y="38" font-family="Sora, 'Space Grotesk', sans-serif"
          font-weight="300" font-size="22" letter-spacing="7" fill="#5A6B7A">DAILYOPS</text>
  </g>

</svg>
