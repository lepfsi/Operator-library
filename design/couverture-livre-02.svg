<?xml version="1.0" encoding="UTF-8"?>
<!--
  Couverture — The Human Single Point of Failure (Livre 2)
  Design System : Technical Editorial / Dark Precision
  Format : 6" x 9" (152 x 229 mm). Grille en pixels (viewBox 0 0 640 960), ratio 6:9.
  Symbole : NŒUD CRITIQUE — réseau de nœuds convergeant vers un seul point.
  Accent livre 2 : Ambre brûlé #C76B2B.
  Date : 2026
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xml:lang="en"
     width="152mm" height="229mm"
     viewBox="0 0 640 960">

  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="light">
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feComposite in="light" in2="SourceGraphic" operator="in" result="tex"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="tex"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="640" height="960" fill="#F7F5F0" filter="url(#paper)"/>

  <!-- ===== BANDEAU SUPÉRIEUR ===== -->
  <rect x="0" y="0" width="640" height="110" fill="#0A1A2F"/>
  <text x="70" y="70" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="300" font-size="30" letter-spacing="18" fill="#1CB5A0">DAILYOPS</text>
  <text x="570" y="70" text-anchor="end" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="300" font-size="24" letter-spacing="9" fill="#5A6B7A" opacity="0.75">THE OPERATOR'S LIBRARY — BOOK 02</text>

  <!-- ===== BLOC TITRE ===== -->
  <rect x="70" y="200" width="500" height="390" fill="#0A1A2F"/>
  <rect x="70" y="200" width="500" height="9" fill="#1CB5A0"/>

  <text x="120" y="310" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="800" font-size="70" letter-spacing="3" fill="#FFFFFF">THE HUMAN</text>
  <text x="120" y="400" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="300" font-size="40" letter-spacing="4" fill="#C76B2B">SINGLE POINT</text>
  <text x="120" y="470" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="300" font-size="40" letter-spacing="4" fill="#C76B2B">OF</text>
  <text x="120" y="560" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="800" font-size="70" letter-spacing="3" fill="#FFFFFF">FAILURE</text>

  <!-- ===== SOUS-TITRE ===== -->
  <text x="120" y="660" font-family="'Source Serif Pro', Georgia, serif"
        font-weight="400" font-style="italic" font-size="44" fill="#5A6B7A">When Knowledge Lives</text>
  <text x="120" y="710" font-family="'Source Serif Pro', Georgia, serif"
        font-weight="400" font-style="italic" font-size="44" fill="#5A6B7A">in One Mind</text>

  <!-- ===== SYMBOLE : NŒUD CRITIQUE (x 70..570, y ~720..840) =====
       Plusieurs nœuds périphériques (acier) reliés à un nœud central (ambre). -->
  <g id="symbole-noeud" stroke="#5A6B7A" stroke-width="4" fill="none">
    <line x1="120" y1="735" x2="320" y2="800"/>
    <line x1="180" y1="845" x2="320" y2="800"/>
    <line x1="320" y1="700" x2="320" y2="800"/>
    <line x1="450" y1="700" x2="320" y2="800"/>
    <line x1="520" y1="735" x2="320" y2="800"/>
    <line x1="490" y1="855" x2="320" y2="800"/>
    <line x1="240" y1="855" x2="320" y2="800"/>
  </g>
  <g fill="#5A6B7A">
    <circle cx="120" cy="735" r="9"/>
    <circle cx="180" cy="845" r="9"/>
    <circle cx="320" cy="700" r="9"/>
    <circle cx="450" cy="700" r="9"/>
    <circle cx="520" cy="735" r="9"/>
    <circle cx="490" cy="855" r="9"/>
    <circle cx="240" cy="855" r="9"/>
  </g>
  <!-- Nœud central critique : ambre + anneau turquoise -->
  <circle cx="320" cy="800" r="28" fill="none" stroke="#1CB5A0" stroke-width="3" opacity="0.45"/>
  <circle cx="320" cy="800" r="17" fill="#C76B2B"/>

  <!-- ===== AUTEUR ===== -->
  <text x="70" y="895" font-family="Sora, 'Space Grotesk', sans-serif"
        font-weight="400" font-size="34" letter-spacing="13" fill="#0A1A2F">BA-NDOUWE STEVE</text>
  <text x="70" y="930" font-family="'Source Serif Pro', Georgia, serif"
        font-weight="300" font-style="italic" font-size="28" fill="#5A6B7A">Systems Engineer · Incident Analyst</text>

  <!-- ===== SIGNATURE DAILYOPS ===== -->
  <g transform="translate(515, 868)">
    <rect x="0" y="0" width="38" height="38" fill="#1CB5A0" rx="4"/>
    <text x="55" y="38" font-family="Sora, 'Space Grotesk', sans-serif"
          font-weight="300" font-size="22" letter-spacing="7" fill="#5A6B7A">DAILYOPS</text>
  </g>

</svg>
